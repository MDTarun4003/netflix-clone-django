{% extends 'base.html' %}

{% block content %}

<h2>Search Results for "{{ query }}"</h2>

{% for movie in movies %}
    <div>
        <a href="{% url 'movie_detail' movie.id %}">
            <img src="{{ movie.thumbnail.url }}" width="150">
            <p>{{ movie.title }}</p>
        </a>
    </div>
{% empty %}
    <p>No results found</p>
{% endfor %}

{% endblock %}
